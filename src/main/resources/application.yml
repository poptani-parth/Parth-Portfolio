spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: portfolio-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:10MB}
      max-request-size: ${MAX_REQUEST_SIZE:20MB}
  jackson:
    default-property-inclusion: non_null

  # MongoDB configuration
  # NOTE: Spring Data MongoDB only ever reads spring.data.mongodb.*. A prior version of this
  # file also set spring.mongodb.* (not a real Spring Boot property), which silently did
  # nothing - the app would fall back to a default localhost:27017 connection unless
  # spring.data.mongodb.uri happened to be set elsewhere. Keep only the real key.
  data:
    mongodb:
        auto-index-creation: ${MONGODB_AUTO_INDEX_CREATION:true}
    redis: 
        url: ${REDIS_URL:redis://localhost:6379}

  # Mail configuration
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
  mongodb:
    uri: ${MONGODB_URI:}

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  ssl:
    enabled: false

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha

contact:
  mail:
    to: ${CONTACT_MAIL_TO:${ADMIN_RESET_EMAIL}}
  rate-limit:
    max-requests: ${CONTACT_RATE_LIMIT_MAX_REQUESTS:5}
    window-minutes: ${CONTACT_RATE_LIMIT_WINDOW_MINUTES:10}

app:
  storage:
    local-dir: ${UPLOAD_DIR:./uploads}
    public-base-url: ${UPLOAD_PUBLIC_URL:/uploads}
  security:
    cors:
      allowed-origin: ${FRONTEND_ORIGIN:http://localhost:5173,http://localhost:3000}
    auth:
        cookies:
            access-name: ${AUTH_ACCESS_COOKIE_NAME:admin-access}
            refresh-name: ${AUTH_REFRESH_COOKIE_NAME:admin-refresh}
            secure: ${AUTH_COOKIE_SECURE:false}
            same-site: ${AUTH_COOKIE_SAME_SITE:Lax}
    jwt:
      secret: ${JWT_SECRET}
      access-ttl: ${JWT_ACCESS_TTL:PT15M}
      refresh-ttl: ${JWT_REFRESH_TTL:P30D}
      issuer: ${JWT_ISSUER:parth-portfolio-api}
      audience: ${JWT_AUDIENCE:parth-portfolio-admin}
    login-rate-limit:
      max-attempts: ${LOGIN_MAX_ATTEMPTS:5}
      window: ${LOGIN_LIMIT_WINDOW:PT15M}
    password-reset:
      mail-to: ${ADMIN_RESET_EMAIL}
      expose-token: ${PASSWORD_RESET_EXPOSE_TOKEN:false}
      # Dedicated rate-limit for POST /api/admin/auth/password-reset.
      # Keyed per IP; counter is always incremented regardless of
      # whether the username exists, to prevent account-existence enumeration.
      rate-limit:
        max-attempts: ${PASSWORD_RESET_MAX_ATTEMPTS:5}
        window: ${PASSWORD_RESET_LIMIT_WINDOW:PT1H}
    admin:
      username: ${ADMIN_USERNAME:admin}
      # BCrypt hash only - never a raw password. Leave ADMIN_PASSWORD_HASH unset to skip
      # bootstrap (AdminBootstrapConfiguration logs a warning and does nothing in that case).
      password-hash: ${ADMIN_PASSWORD_HASH:}
      bootstrap-enabled: ${ADMIN_BOOTSTRAP_ENABLED:false}
    force-https: ${FORCE_HTTPS:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never